<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Guard AI - 청소년 수면 유도 앱</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      margin: 0;
      background-color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .phone-frame {
      width: 375px;
      height: 720px;
      border-radius: 44px;
      border: 10px solid #1f2937;
      background-color: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
      color: #111827;
      transition: filter 0.8s ease, background-color 0.8s ease;
      user-select: none;
    }
    .phone-frame.sleep-dimmed { filter: brightness(0.45) grayscale(0.75); }
    .status-bar {
      height: 38px;
      padding: 10px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      position: relative;
      z-index: 20;
    }
    .notch {
      width: 130px;
      height: 24px;
      background: #1f2937;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    .page {
      position: absolute;
      top: 38px;
      left: 0;
      width: 100%;
      height: calc(100% - 38px);
      padding: 20px 24px 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease;
      background: inherit;
    }
    .page.hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
    .page.hidden-left { transform: translateX(-100%); opacity: 0; pointer-events: none; }
    .page.active { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .time-box {
      background: #f3f4f6;
      border: 2px dashed #9ca3af;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin: 15px 0;
    }
    .time-box:hover { background: #e5e7eb; border-color: #4f46e5; }
    .time-box.set { border-style: solid; border-color: #4f46e5; background: #eef2ff; }
    .time-display {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #1f2937;
      font-variant-numeric: tabular-nums;
    }
    .time-hint { font-size: 13px; color: #6b7280; margin-top: 6px; }
    .card {
      background: #f9fafb;
      border-radius: 18px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      margin-bottom: 12px;
    }
    .slider-row { margin-bottom: 14px; }
    .slider-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type=range] { width: 100%; accent-color: #4f46e5; cursor: pointer; }
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:disabled { background: #c7d2fe; cursor: not-allowed; }
    .btn-dark { background: #1f2937; color: white; }
    .btn-danger { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
    .btn-success { background: #10b981; color: white; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .picker-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      display: none;
      align-items: flex-end;
    }
    .picker-sheet {
      width: 100%;
      background: #ffffff;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px 24px 28px;
      box-sizing: border-box;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .step-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      background: #eef2ff;
      color: #4f46e5;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .wheel-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      height: 168px;
      position: relative;
      margin: 12px 0;
    }
    .wheel-col {
      width: 78px;
      height: 168px;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      text-align: center;
      z-index: 2;
      scrollbar-width: none;
      border-radius: 16px;
      transition: background-color 0.25s, box-shadow 0.25s;
      position: relative;
      cursor: grab;
    }
    .wheel-col:active { cursor: grabbing; }
    .wheel-col::-webkit-scrollbar { display: none; }
    .wheel-col.focused { background-color: #eef2ff; box-shadow: inset 0 0 0 2px #6366f1; }
    .wheel-center-bar {
      position: absolute;
      top: 50%;
      left: 6%;
      right: 6%;
      height: 42px;
      transform: translateY(-50%);
      border-top: 1px solid #c7d2fe;
      border-bottom: 1px solid #c7d2fe;
      pointer-events: none;
      z-index: 1;
    }
    .wheel-item {
      height: 42px;
      line-height: 42px;
      font-size: 20px;
      font-weight: 700;
      color: #4b5563;
      scroll-snap-align: center;
      cursor: pointer;
      transition: color 0.15s, transform 0.15s;
    }
    .wheel-item:hover { color: #4f46e5; }
    .wheel-item.selected { color: #312e81; font-size: 22px; font-weight: 800; }
    .wheel-spacer { height: 63px; }
    .result-hero {
      background: linear-gradient(135deg, #312e81, #4f46e5);
      color: white;
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      margin: 10px 0;
    }
    .mission-card {
      background: #1f2937;
      color: #f9fafb;
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="phone-frame" id="phoneFrame">
  <div class="status-bar">
    <span id="statusTime">21:30</span>
    <div class="notch"></div>
    <span id="brightnessStatus">☀️ 85%</span>
  </div>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div>
      <div style="font-size:12px; font-weight:700; color:#4f46e5; margin-top:8px;">SLEEP GUARD AI</div>
      <h2 style="margin:4px 0 6px; font-size:22px;">내일 몇 시에 일어나나요?</h2>
      <p style="margin:0; font-size:13px; color:#6b7280;">청소년 권장 수면 <b>9시간(REM 6주기)</b>을 역산해 드려요.</p>

      <div class="time-box" id="timeBox">
        <div class="time-display" id="wakeTimeDisplay">__ : __</div>
        <div class="time-hint" id="wakeTimeHint">👆 여기를 터치해 다이얼로 시간 설정</div>
      </div>

      <div class="card">
        <div style="font-size:12px; font-weight:700; color:#4b5563; margin-bottom:10px;">🤖 AI 입면 시간 예측 데이터</div>
        <div class="slider-row">
          <div class="slider-label">
